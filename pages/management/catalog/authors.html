<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authors - AklatBayon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="/css/custom.css" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('aklatbayon_theme');if(t==='dark')document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark');})()</script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          
        }
      }
    }
  </script>
</head>
<body class="font-sans min-h-screen antialiased ab-body-themed">
  <div class="astral-layout">
    <header id="top-header"></header>
    <nav id="sidebar-nav"></nav>
    <main class="astral-main pb-12">
      <div id="alert-container"></div>

      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <span class="material-symbols-outlined text-[#ffb599]">edit</span>Authors
        </h1>
        <button id="btn-add" class="inline-flex items-center gap-1.5 px-4 py-2.5 text-sm font-semibold rounded-lg bg-[#ffb599] text-[#370e00] hover:shadow-[0_4px_20px_rgba(255,181,153,0.3)] transition-colors shadow-sm">
          <span class="material-symbols-outlined text-base">add_circle</span> Add Author
        </button>
      </div>

      <!-- Search / Filter Bar -->
      <div class="mb-5">
        <div class="relative max-w-sm">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">search</span>
          <input type="text" id="search-input" placeholder="Search authors..." class="w-full h-11 pl-10 pr-3.5 text-sm rounded-lg border border-[#3a3a52] bg-[#1e1e32] focus:outline-none focus:border-[#ffb599] focus:ring-1 focus:ring-[#ffb599]/30">
        </div>
      </div>

      <!-- Table Card -->
      <div class="astral-card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead>
              <tr class="border-b border-[#3a3a52] bg-[#1a1a2e]">
                <th class="px-5 py-3 font-semibold text-[#9b99b8]">#</th>
                <th class="px-5 py-3 font-semibold text-[#9b99b8]">Name</th>
                <th class="px-5 py-3 font-semibold text-[#9b99b8]">Bio</th>
                <th class="px-5 py-3 font-semibold text-[#9b99b8]">Books</th>
                <th class="px-5 py-3 font-semibold text-[#9b99b8]">Actions</th>
              </tr>
            </thead>
            <tbody id="data-table" class="divide-y divide-[#3a3a52]/50"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Modal -->
  <div id="modal-form" class="modal-overlay fixed inset-0 bg-black/50 z-[2000] items-center justify-center">
    <div class="bg-white dark:bg-slate-900 rounded-2xl w-[95%] max-w-[600px] max-h-[90vh] overflow-y-auto shadow-2xl animate-modal-in">
      <div class="flex items-center justify-between px-6 py-4 border-b border-[#3a3a52]">
        <h3 id="modal-title" class="text-lg font-bold">Add Author</h3>
        <button class="modal-close flex h-8 w-8 items-center justify-center rounded-lg bg-[#333348] hover:bg-[#3a3a52] transition-colors">
          <span class="material-symbols-outlined text-base">close</span>
        </button>
      </div>
      <div class="p-6">
        <input type="hidden" id="edit-id">
        <div class="mb-4">
          <label class="block text-sm font-semibold text-[#e2e0fc] mb-1.5">Name</label>
          <input type="text" id="f-name" class="w-full h-11 px-3.5 text-sm rounded-lg border border-[#3a3a52] bg-[#1e1e32] focus:outline-none focus:border-[#ffb599] focus:ring-1 focus:ring-[#ffb599]/30">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-[#e2e0fc] mb-1.5">Bio</label>
          <textarea id="f-bio" rows="3" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-[#3a3a52] bg-[#1e1e32] focus:outline-none focus:border-[#ffb599] focus:ring-1 focus:ring-[#ffb599]/30 resize-none"></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-2 px-6 py-4 border-t border-[#3a3a52]">
        <button class="modal-close px-4 py-2 text-sm rounded-lg border border-[#3a3a52] hover:bg-[#ffb599]/5 transition-colors">Cancel</button>
        <button id="btn-save" class="inline-flex items-center gap-1.5 px-4 py-2 text-sm rounded-lg bg-[#ffb599] text-[#370e00] hover:shadow-[0_4px_20px_rgba(255,181,153,0.3)] transition-colors">
          <span class="material-symbols-outlined text-base">save</span> Save
        </button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) { window.location.href = '/pages/auth/login.html'; throw ''; }
    App.init(); App.bindModalCloses();
    const load = () => {
        let items = Store.getAll('authors');
        const books = Store.getAll('books');
        const s = document.getElementById('search-input').value.toLowerCase();
        if (s) items = items.filter((i) => i.name.toLowerCase().includes(s));
        const tbody = document.getElementById('data-table');
        if (!items.length) { tbody.innerHTML = '<tr><td colspan="5" class="px-5 py-10 text-center text-[#9b99b8]">No authors found.</td></tr>'; return; }
        tbody.innerHTML = items.map((a, i) => {
            const bookCount = books.filter((b) => b.author_id === a.id).length;
            return `<tr class="hover:bg-[#ffb599]/5 transition-colors"><td class="px-5 py-3 text-[#9b99b8]">${i+1}</td><td class="px-5 py-3 font-semibold">${a.name}</td><td class="px-5 py-3 text-slate-500 max-w-xs truncate">${a.bio || '\u2014'}</td><td class="px-5 py-3"><span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-full " style="background:rgba(96,165,250,0.15);color:#60a5fa;border:1px solid rgba(96,165,250,0.3)">${bookCount}</span></td><td class="px-5 py-3"><div class="flex items-center gap-1"><button class="btn-edit flex h-8 w-8 items-center justify-center rounded-lg text-[#ffb599] hover:bg-primary-50 dark:hover:bg-slate-800 transition-colors" data-id="${a.id}" title="Edit"><span class="material-symbols-outlined text-[19px]">edit</span></button><button class="btn-del flex h-8 w-8 items-center justify-center rounded-lg text-red-500 hover:bg-[#f87171]/10 transition-colors" data-id="${a.id}" data-name="${a.name}" title="Delete"><span class="material-symbols-outlined text-[19px]">delete</span></button></div></td></tr>`;
        }).join('');
        bind();
    };
    const bind = () => {
        document.querySelectorAll('.btn-edit').forEach((b) => { b.addEventListener('click', () => {
            const a = Store.getById('authors', b.dataset.id); if (!a) return;
            document.getElementById('modal-title').textContent = 'Edit Author'; document.getElementById('edit-id').value = a.id;
            document.getElementById('f-name').value = a.name; document.getElementById('f-bio').value = a.bio || '';
            App.openModal('modal-form');
        }); });
        document.querySelectorAll('.btn-del').forEach((b) => { b.addEventListener('click', () => {
            const id = b.dataset.id, name = b.dataset.name;
            App.confirmDelete(name).then((r) => { if (r.isConfirmed) { Store.remove('authors', id); App.showAlert('success', 'Author deleted.'); load(); } });
        }); });
    };
    document.getElementById('btn-add').addEventListener('click', () => {
        document.getElementById('modal-title').textContent = 'Add Author'; document.getElementById('edit-id').value = '';
        document.getElementById('f-name').value = ''; document.getElementById('f-bio').value = '';
        App.openModal('modal-form');
    });
    document.getElementById('btn-save').addEventListener('click', () => {
        const name = document.getElementById('f-name').value.trim(), bio = document.getElementById('f-bio').value.trim();
        if (!name) { App.showAlert('danger', 'Name required.'); return; }
        const eid = document.getElementById('edit-id').value;
        const promise = eid ? Store.update('authors', eid, { name, bio }) : Store.create('authors', { name, bio });
        promise.then(() => {
            App.showAlert('success', eid ? 'Author updated.' : 'Author added.');
            App.closeModal('modal-form'); load();
        }).catch((err) => {
            Swal.fire({icon:'error',title:'Not Allowed',text:err.message||'Could not save.',confirmButtonColor:'#e94560'});
        });
    });
    document.getElementById('search-input').addEventListener('input', load);
    load();
  </script>
</body>
</html>
