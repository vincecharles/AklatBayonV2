<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Catalog - AklatBayon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="/css/custom.css" rel="stylesheet">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
</head>
<body class="font-sans min-h-screen antialiased" style="background:#111125;color:#e2e0fc">

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">

    <!-- Header Banner -->
    <div class="text-white py-10 px-8 rounded-b-3xl -mx-4 sm:-mx-6 lg:-mx-8 mb-6 text-center relative overflow-hidden" style="background:linear-gradient(135deg, #1a1a2e 0%, #28283d 50%, #1e1e32 100%)">
      <div class="absolute inset-0 bg-gradient-to-br from-[#ffb599]/5 to-transparent"></div>
      <div class="relative z-10">
        <h1 class="text-3xl sm:text-4xl font-black mb-2 flex items-center justify-center gap-3 text-[#ffb599]">
          <span class="material-symbols-outlined text-4xl">menu_book</span>
          Central Repository
        </h1>
        <p class="text-[#9b99b8] text-sm">Access the collective wisdom of the Bayon archives. Explore indexed volumes and digital manuscripts.</p>

        <!-- Search -->
        <div class="max-w-lg mx-auto mt-5 relative">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#9b99b8] text-xl">search</span>
          <input type="text" id="search-input" placeholder="Search the repository..."
                 class="w-full py-3.5 pl-12 pr-5 rounded-full border border-[#3a3a52] bg-[#1a1a2e] text-[#e2e0fc] text-base placeholder-[#9b99b8] backdrop-blur-lg focus:outline-none focus:border-[#ffb599] focus:ring-2 focus:ring-[#ffb599]/20 transition-all">
        </div>

        <!-- Quick Filters -->
        <div class="flex flex-wrap gap-3 items-center justify-center mt-6">
          <span class="text-xs text-[#9b99b8] uppercase tracking-wider font-semibold">Quick Filters:</span>
          <select id="filter-cat" class="astral-select text-sm py-2 px-3 rounded-full" style="width:auto;min-width:140px">
            <option value="">All Categories</option>
          </select>
          <select id="filter-author" class="astral-select text-sm py-2 px-3 rounded-full" style="width:auto;min-width:140px">
            <option value="">Author ▾</option>
          </select>
          <select id="filter-publisher" class="astral-select text-sm py-2 px-3 rounded-full" style="width:auto;min-width:140px">
            <option value="">Publisher ▾</option>
          </select>
          <select id="filter-sort" class="astral-select text-sm py-2 px-3 rounded-full" style="width:auto;min-width:140px">
            <option value="title-az">Title A-Z</option>
            <option value="title-za">Title Z-A</option>
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="most-borrowed">Most Borrowed</option>
          </select>
        </div>

        <div class="flex flex-wrap gap-3 items-center justify-center mt-3">
          <div class="flex items-center gap-2">
            <input type="number" id="filter-year-min" placeholder="Year Min" min="0" max="9999" class="astral-input text-sm py-2 px-3 rounded-full" style="width:100px">
            <span class="text-[#9b99b8]">—</span>
            <input type="number" id="filter-year-max" placeholder="Year Max" min="0" max="9999" class="astral-input text-sm py-2 px-3 rounded-full" style="width:100px">
          </div>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="filter-available" class="w-4 h-4 rounded accent-[#ffb599]">
            <span class="text-sm text-[#e2e0fc]">Available only</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Nav Links -->
    <div class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_6px_#4ade80]"></span>
        <span class="text-xs text-emerald-400 uppercase tracking-wider font-semibold">System Online</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="/index.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-[#ffb599] hover:underline">
          <span class="material-symbols-outlined text-lg">badge</span> RFID Tap
        </a>
        <a href="/pages/auth/login.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-[#ffb599] hover:underline">
          <span class="material-symbols-outlined text-lg">login</span> Login
        </a>
      </div>
    </div>

    <!-- New Arrivals -->
    <div id="new-arrivals" class="mb-6 hidden">
      <h5 class="text-lg font-bold text-[#ffb599] mb-3 flex items-center gap-2">
        <span class="material-symbols-outlined">auto_awesome</span>
        New Arrivals
        <span class="bg-gradient-to-r from-[#ffb599] to-[#e17141] text-[#370e00] text-[11px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide">New</span>
      </h5>
      <div class="grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-5" id="new-arrivals-grid"></div>
    </div>

    <!-- Did You Mean -->
    <div id="did-you-mean" class="hidden text-center py-3 text-[#9b99b8] text-sm">
      Did you mean: <a href="#" id="dym-link" class="text-[#ffb599] font-semibold hover:underline"></a>?
    </div>

    <!-- Book Grid -->
    <div class="grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-5" id="book-grid"></div>

    <!-- Status Bar -->
    <div class="fixed bottom-0 left-0 right-0 flex items-center justify-center gap-8 py-3 z-50 border-t border-[#3a3a52]" style="background:rgba(26,26,46,0.8);backdrop-filter:blur(12px)">
      <div class="flex items-center gap-2 text-xs text-[#9b99b8]">
        <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_6px_#4ade80]"></span> System Online
      </div>
      <div class="flex items-center gap-2 text-xs text-[#9b99b8]" id="status-returns">Your Returns: <span class="text-[#e2e0fc] font-bold">0 Items Due</span></div>
      <div class="flex items-center gap-2 text-xs text-[#9b99b8]">Queue Pos: <span class="text-[#ffb599] font-bold">#14</span></div>
    </div>

  </main>

  <script src="/js/api.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const getAuthorName = (authorId) => { const a = Store.getById('authors', authorId); return a ? a.name : 'Unknown'; };
    const getPublisherName = (pubId) => { const p = Store.getById('publishers', pubId); return p ? p.name : 'Unknown'; };
    const getCategoryName = (catId) => { const c = Store.getById('categories', catId); return c ? c.name : 'Unknown'; };

    const categories = Store.getAll('categories');
    const fcat = document.getElementById('filter-cat');
    categories.forEach((c) => { fcat.innerHTML += `<option value="${c.id}">${c.name}</option>`; });

    const authors = Store.getAll('authors');
    const fauthor = document.getElementById('filter-author');
    authors.sort((a, b) => a.name.localeCompare(b.name));
    authors.forEach((a) => { fauthor.innerHTML += `<option value="${a.id}">${a.name}</option>`; });

    const publishers = Store.getAll('publishers');
    const fpub = document.getElementById('filter-publisher');
    publishers.sort((a, b) => a.name.localeCompare(b.name));
    publishers.forEach((p) => { fpub.innerHTML += `<option value="${p.id}">${p.name}</option>`; });

    const levenshtein = (a, b) => {
        const m = a.length, n = b.length; const dp = [];
        for (let i = 0; i <= m; i++) { dp[i] = [i]; for (let j = 1; j <= n; j++) { if (i === 0) { dp[i][j] = j; continue; } const cost = a[i-1] === b[j-1] ? 0 : 1; dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost); } } return dp[m][n];
    };

    const buildBookCard = (b) => {
        const availColor = b.available > 0 ? '#4ade80' : '#f87171';
        const availText = b.available > 0 ? 'AVAILABLE' : 'BORROWED';
        const availBg = b.available > 0 ? 'rgba(74,222,128,0.15)' : 'rgba(248,113,113,0.15)';
        const pct = b.copies > 0 ? Math.round((b.available / b.copies) * 100) : 0;
        const barColor = pct > 50 ? '#4ade80' : pct > 20 ? '#fbbf24' : '#f87171';
        return `<div class="astral-card p-5 transition-all hover:shadow-[0_8px_30px_rgba(0,0,0,0.3)] hover:-translate-y-1 cursor-pointer">
${b.call_number ? `<div class="inline-block text-xs text-[#ffb599] bg-[#ffb599]/10 px-2 py-1 rounded-md mb-2 font-semibold font-mono"><span class="material-symbols-outlined text-[10px] align-middle mr-0.5">tag</span>${b.call_number}</div>` : ''}
<div class="flex items-start justify-between gap-2 mb-2">
  <span class="text-lg font-bold text-[#e2e0fc]">${b.title}</span>
  <span class="text-[11px] font-bold uppercase px-2 py-0.5 rounded-full whitespace-nowrap" style="background:${availBg};color:${availColor};border:1px solid ${availColor}30">${availText}</span>
</div>
<div class="text-[13px] text-[#9b99b8] mb-1 flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">edit</span> ${getAuthorName(b.author_id)}</div>
<div class="text-[13px] text-[#9b99b8] mb-1 flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">apartment</span> ${getPublisherName(b.publisher_id)}</div>
<div class="text-[13px] text-[#9b99b8] mb-1 flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">label</span> ${getCategoryName(b.category_id)}</div>
<div class="text-[13px] text-[#9b99b8] mb-1 flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">barcode</span> ${b.isbn}</div>
<div class="text-[13px] text-[#9b99b8] mb-3 flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">event</span> ${b.year}</div>
<div class="flex items-center justify-between text-[11px] text-[#9b99b8] mb-1"><span>${b.available} of ${b.copies} available</span><span>${pct}%</span></div>
<div class="h-1.5 rounded-full bg-[#3a3a52] overflow-hidden"><div class="h-full rounded-full transition-all" style="width:${pct}%;background:${barColor}"></div></div>
</div>`;
    };

    const loadNewArrivals = () => {
        const allBooks = Store.getAll('books');
        const thirtyDaysAgo = new Date(Date.now() - 30*24*60*60*1000);
        const newBooks = allBooks.filter((b) => b.created_at && new Date(b.created_at) >= thirtyDaysAgo);
        const container = document.getElementById('new-arrivals');
        const grid = document.getElementById('new-arrivals-grid');
        if (!newBooks.length) { container.classList.add('hidden'); return; }
        newBooks.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        container.classList.remove('hidden');
        grid.innerHTML = newBooks.map(buildBookCard).join('');
    };

    const load = () => {
        let books = Store.getAll('books');
        const s = document.getElementById('search-input').value.toLowerCase();
        const cf = document.getElementById('filter-cat').value;
        const af = document.getElementById('filter-author').value;
        const pf = document.getElementById('filter-publisher').value;
        const yearMin = document.getElementById('filter-year-min').value;
        const yearMax = document.getElementById('filter-year-max').value;
        const sortBy = document.getElementById('filter-sort').value;
        const onlyAvail = document.getElementById('filter-available').checked;

        if (s) books = books.filter((b) => b.title.toLowerCase().includes(s) || b.isbn.toLowerCase().includes(s) || getAuthorName(b.author_id).toLowerCase().includes(s));
        if (cf) books = books.filter((b) => b.category_id === cf);
        if (af) books = books.filter((b) => b.author_id === af);
        if (pf) books = books.filter((b) => b.publisher_id === pf);
        if (yearMin) books = books.filter((b) => b.year >= parseInt(yearMin, 10));
        if (yearMax) books = books.filter((b) => b.year <= parseInt(yearMax, 10));
        if (onlyAvail) books = books.filter((b) => b.available > 0);

        if (sortBy === 'title-az') books.sort((a,b) => a.title.localeCompare(b.title));
        else if (sortBy === 'title-za') books.sort((a,b) => b.title.localeCompare(a.title));
        else if (sortBy === 'newest') books.sort((a,b) => (b.year||0)-(a.year||0));
        else if (sortBy === 'oldest') books.sort((a,b) => (a.year||0)-(b.year||0));
        else if (sortBy === 'most-borrowed') {
            const txns = Store.getAll('transactions');
            books.sort((a,b) => txns.filter(t=>t.book_id===b.id).length - txns.filter(t=>t.book_id===a.id).length);
        }

        const grid = document.getElementById('book-grid');
        const dymContainer = document.getElementById('did-you-mean');
        dymContainer.classList.add('hidden');

        if (!books.length) {
            grid.innerHTML = '<div class="col-span-full flex flex-col items-center justify-center py-16 text-[#9b99b8]"><span class="material-symbols-outlined text-5xl mb-3">search</span><p class="text-base">No volumes found in the repository.</p></div>';
            if (s) {
                const allBooks = Store.getAll('books');
                let bestMatch = null, bestDist = Infinity;
                allBooks.forEach((b) => {
                    let dist = levenshtein(s, b.title.toLowerCase());
                    b.title.toLowerCase().split(/\s+/).forEach((w) => { const d = levenshtein(s,w); if(d<dist) dist=d; });
                    if (dist < bestDist) { bestDist = dist; bestMatch = b.title; }
                });
                if (bestMatch && bestDist < 4) {
                    document.getElementById('dym-link').textContent = bestMatch;
                    dymContainer.classList.remove('hidden');
                }
            }
            return;
        }
        grid.innerHTML = books.map(buildBookCard).join('');
    };

    document.getElementById('dym-link').addEventListener('click', (e) => {
        e.preventDefault(); document.getElementById('search-input').value = e.target.textContent;
        document.getElementById('did-you-mean').classList.add('hidden'); load();
    });

    document.getElementById('search-input').addEventListener('input', load);
    document.getElementById('filter-cat').addEventListener('change', load);
    document.getElementById('filter-author').addEventListener('change', load);
    document.getElementById('filter-publisher').addEventListener('change', load);
    document.getElementById('filter-year-min').addEventListener('input', load);
    document.getElementById('filter-year-max').addEventListener('input', load);
    document.getElementById('filter-sort').addEventListener('change', load);
    document.getElementById('filter-available').addEventListener('change', load);

    loadNewArrivals();
    load();
  </script>
</body>
</html>
