<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Catalog - AklatBayon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="/css/custom.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3/dist/JsBarcode.all.min.js"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <style>.lcc-spinner{width:24px;height:24px;border:3px solid #3a3a52;border-top-color:#ffb599;border-radius:50%;animation:spin 0.8s linear infinite;margin:20px auto;display:block}</style>
</head>
<body class="font-sans min-h-screen antialiased">
  <div class="astral-layout">
    <header id="top-header"></header>
    <nav id="sidebar-nav"></nav>
    <main class="astral-main pb-12">
      <div id="alert-container"></div>

      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <h1 class="astral-page-title flex items-center gap-3">
          <span class="material-symbols-outlined" style="font-size:28px;color:var(--ab-primary)">auto_stories</span> Book Catalog
        </h1>
        <button id="btn-add" style="display:none" class="astral-btn astral-btn-primary">
          <span class="material-symbols-outlined text-base">add_circle</span> Add Volume
        </button>
      </div>

      <!-- Filter Bar -->
      <div class="flex flex-wrap items-center gap-3 mb-5">
        <div class="relative flex-1 min-w-[200px] max-w-xs">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#9b99b8] text-xl">search</span>
          <input type="text" id="search-input" placeholder="Search volumes..." class="astral-input pl-10 text-sm">
        </div>
        <select id="filter-cat" class="astral-select text-sm" style="width:auto;min-width:140px"><option value="">All Categories</option></select>
        <select id="filter-author" class="astral-select text-sm" style="width:auto;min-width:140px"><option value="">All Authors</option></select>
        <select id="filter-pub" class="astral-select text-sm" style="width:auto;min-width:140px"><option value="">All Publishers</option></select>
        <select id="filter-avail" class="astral-select text-sm" style="width:auto;min-width:120px">
          <option value="">All</option><option value="available">Available</option><option value="unavailable">Unavailable</option>
        </select>
        <select id="filter-sort" class="astral-select text-sm" style="width:auto;min-width:120px">
          <option value="">Default</option><option value="title-az">Title A-Z</option><option value="title-za">Title Z-A</option><option value="newest">Newest</option><option value="oldest">Oldest</option>
        </select>
      </div>

      <!-- Table -->
      <div class="astral-card">
        <div class="overflow-x-auto">
          <table class="astral-table">
            <thead>
              <tr>
                <th>#</th><th>Title</th><th>Author</th><th>Publisher</th><th>Category</th><th>ISBN</th><th>Call #</th><th>Year</th><th>Copies</th><th>Avail</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="data-table"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div id="modal-form" class="modal-overlay">
    <div class="astral-modal" style="max-width:640px">
      <div class="astral-modal-header">
        <h3 id="modal-title" class="text-lg font-bold">Add Volume</h3>
        <button class="modal-close flex h-8 w-8 items-center justify-center rounded-lg bg-[#333348] hover:bg-[#3a3a52] transition-colors"><span class="material-symbols-outlined text-base">close</span></button>
      </div>
      <div class="astral-modal-body space-y-4">
        <input type="hidden" id="edit-id">
        <div><label class="astral-label">Title</label><input type="text" id="f-title" class="astral-input"></div>
        <div><label class="astral-label">ISBN</label><input type="text" id="f-isbn" class="astral-input"></div>
        <div><label class="astral-label">Author</label><select id="f-author" class="astral-select"></select></div>
        <div><label class="astral-label">Publisher</label><select id="f-publisher" class="astral-select"></select></div>
        <div><label class="astral-label">Category</label><select id="f-category" class="astral-select"></select></div>
        <div class="grid grid-cols-3 gap-4">
          <div><label class="astral-label">Year</label><input type="number" id="f-year" class="astral-input"></div>
          <div><label class="astral-label">Copies</label><input type="number" id="f-copies" min="0" class="astral-input"></div>
          <div><label class="astral-label">Available</label><input type="number" id="f-available" min="0" class="astral-input"></div>
        </div>
        <div class="flex gap-2 items-end">
          <div class="flex-1"><label class="astral-label">LCC Call Number</label><input type="text" id="f-callnumber" placeholder="e.g. QA76.76.D47" class="astral-input"></div>
          <button type="button" id="btn-lcc-lookup" class="astral-btn astral-btn-outline text-xs whitespace-nowrap"><span class="material-symbols-outlined text-base">search</span>Assign LCC</button>
        </div>
      </div>
      <div class="astral-modal-footer">
        <button class="modal-close astral-btn astral-btn-outline">Cancel</button>
        <button id="btn-save" class="astral-btn astral-btn-primary"><span class="material-symbols-outlined text-base">save</span> Save</button>
      </div>
    </div>
  </div>

  <!-- LCC Lookup Modal -->
  <div id="modal-lcc" class="modal-overlay">
    <div class="astral-modal" style="max-width:520px">
      <div class="astral-modal-header">
        <h3 class="text-lg font-bold">Assign LCC Call Number</h3>
        <button class="modal-close flex h-8 w-8 items-center justify-center rounded-lg bg-[#333348] hover:bg-[#3a3a52] transition-colors"><span class="material-symbols-outlined text-base">close</span></button>
      </div>
      <div class="astral-modal-body">
        <label class="astral-label">Search LOC by title or keyword</label>
        <div class="flex gap-2 mb-4">
          <input type="text" id="lcc-search-input" placeholder="Enter book title..." class="astral-input flex-1">
          <button id="btn-lcc-search" class="astral-btn astral-btn-primary px-3"><span class="material-symbols-outlined text-lg">search</span></button>
        </div>
        <div id="lcc-loading" style="display:none"><div class="lcc-spinner"></div></div>
        <div id="lcc-results" class="max-h-[350px] overflow-y-auto"></div>
        <div id="lcc-empty" class="text-center text-[#9b99b8] text-sm py-4" style="display:none">No results. Try a different search term.</div>
      </div>
    </div>
  </div>

  <!-- Barcode Modal -->
  <div id="modal-barcode" class="modal-overlay">
    <div class="astral-modal" style="max-width:420px">
      <div class="astral-modal-header">
        <h3 class="text-lg font-bold">Book Barcode</h3>
        <button class="modal-close flex h-8 w-8 items-center justify-center rounded-lg bg-[#333348] hover:bg-[#3a3a52] transition-colors"><span class="material-symbols-outlined text-base">close</span></button>
      </div>
      <div class="astral-modal-body text-center">
        <div id="barcode-book-title" class="font-bold text-base mb-1"></div>
        <div id="barcode-book-isbn" class="text-xs text-[#9b99b8] mb-4"></div>
        <svg id="barcode-svg"></svg>
        <div class="mt-4">
          <button id="btn-print-barcode" class="astral-btn astral-btn-primary"><span class="material-symbols-outlined text-base">print</span> Print Label</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) { window.location.href = '/pages/auth/login.html'; throw ''; }
    App.init(); App.bindModalCloses();
    if (Auth.hasPermission('can_add_books')) document.getElementById('btn-add').style.display='';
    const authors = Store.getAll('authors'), publishers = Store.getAll('publishers'), categories = Store.getAll('categories');
    const asel=document.getElementById('f-author'), psel=document.getElementById('f-publisher'), csel=document.getElementById('f-category'), fcat=document.getElementById('filter-cat');
    const fAuthor=document.getElementById('filter-author'), fPub=document.getElementById('filter-pub');
    authors.forEach((a) => {asel.innerHTML+=`<option value="${a.id}">${a.name}</option>`; fAuthor.innerHTML+=`<option value="${a.id}">${a.name}</option>`;});
    publishers.forEach((p) => {psel.innerHTML+=`<option value="${p.id}">${p.name}</option>`; fPub.innerHTML+=`<option value="${p.id}">${p.name}</option>`;});
    categories.forEach((c) => {csel.innerHTML+=`<option value="${c.id}">${c.name}</option>`; fcat.innerHTML+=`<option value="${c.id}">${c.name}</option>`;});

    const load = () => {
        let items = Store.getAll('books');
        const s = document.getElementById('search-input').value.toLowerCase(), cf = document.getElementById('filter-cat').value;
        const af = document.getElementById('filter-author').value, pf = document.getElementById('filter-pub').value;
        const avf = document.getElementById('filter-avail').value, sf = document.getElementById('filter-sort').value;
        if (s) items = items.filter((i) => i.title.toLowerCase().includes(s) || i.isbn.toLowerCase().includes(s));
        if (cf) items = items.filter((i) => i.category_id === cf);
        if (af) items = items.filter((i) => i.author_id === af);
        if (pf) items = items.filter((i) => i.publisher_id === pf);
        if (avf === 'available') items = items.filter((i) => i.available > 0);
        if (avf === 'unavailable') items = items.filter((i) => i.available === 0);
        switch (sf) {
            case 'title-az': items.sort((a,b) => a.title.localeCompare(b.title)); break;
            case 'title-za': items.sort((a,b) => b.title.localeCompare(a.title)); break;
            case 'newest': items.sort((a,b) => b.year - a.year); break;
            case 'oldest': items.sort((a,b) => a.year - b.year); break;
        }
        const tbody = document.getElementById('data-table');
        if (!items.length) { tbody.innerHTML='<tr><td colspan="11" class="px-5 py-10 text-center" style="color:var(--ab-on-surface-dim)">No volumes found in the archive.</td></tr>'; return; }
        const canEdit = Auth.hasPermission('can_edit_books'), canDel = Auth.hasPermission('can_delete_books');
        tbody.innerHTML = items.map((b,i) => {
            let acts = '<div class="flex items-center gap-1">';
            if (canEdit) acts += `<button class="btn-edit flex h-8 w-8 items-center justify-center rounded-lg hover:bg-[var(--ab-surface-low)] transition-colors" style="color:var(--ab-primary)" data-id="${b.id}" title="Edit"><span class="material-symbols-outlined text-[19px]">edit</span></button>`;
            if (canDel) acts += `<button class="btn-del flex h-8 w-8 items-center justify-center rounded-lg hover:bg-[var(--ab-error-light)] transition-colors" style="color:var(--ab-error)" data-id="${b.id}" data-name="${b.title.replace(/"/g,'&quot;')}" title="Delete"><span class="material-symbols-outlined text-[19px]">delete</span></button>`;
            acts += `<button class="btn-barcode flex h-8 w-8 items-center justify-center rounded-lg hover:bg-[var(--ab-surface-low)] transition-colors" style="color:var(--ab-on-surface-dim)" data-id="${b.id}" data-title="${b.title.replace(/"/g,'&quot;')}" data-isbn="${b.isbn}" title="Barcode"><span class="material-symbols-outlined text-[19px]">barcode</span></button>`;
            acts += '</div>';
            if (!canEdit && !canDel) acts = '<span class="text-xs" style="color:var(--ab-on-surface-dim)">View only</span>';
            const cn = b.call_number || '';
            return `<tr>
<td>${i+1}</td>
<td class="font-semibold">${b.title}</td>
<td>${App.getAuthorName(b.author_id)}</td>
<td>${App.getPublisherName(b.publisher_id)}</td>
<td><span class="astral-badge astral-badge-primary">${App.getCategoryName(b.category_id)}</span></td>
<td><code class="text-xs px-1.5 py-0.5 rounded font-mono" style="background:var(--ab-surface-high);color:var(--ab-on-surface-dim)">${b.isbn}</code></td>
<td>${cn ? `<code class="text-[11px] px-1.5 py-0.5 rounded font-mono" style="background:var(--ab-surface-high);color:var(--ab-primary)">${cn}</code>` : '\u2014'}</td>
<td>${b.year}</td>
<td>${b.copies}</td>
<td><span class="astral-badge ${b.available>0 ? 'astral-badge-available' : 'astral-badge-overdue'}">${b.available}</span></td>
<td>${acts}</td></tr>`;
        }).join('');
        bindActions();
    };

    const bindActions = () => {
        document.querySelectorAll('.btn-edit').forEach((btn) => {btn.addEventListener('click', () => {
            const b=Store.getById('books',btn.dataset.id); if(!b) return;
            document.getElementById('modal-title').textContent='Edit Volume'; document.getElementById('edit-id').value=b.id;
            document.getElementById('f-title').value=b.title; document.getElementById('f-isbn').value=b.isbn;
            document.getElementById('f-author').value=b.author_id; document.getElementById('f-publisher').value=b.publisher_id;
            document.getElementById('f-category').value=b.category_id; document.getElementById('f-year').value=b.year;
            document.getElementById('f-copies').value=b.copies; document.getElementById('f-available').value=b.available;
            document.getElementById('f-callnumber').value=b.call_number||'';
            App.openModal('modal-form');
        });});
        document.querySelectorAll('.btn-del').forEach((btn) => {btn.addEventListener('click', () => {
            const id=btn.dataset.id,name=btn.dataset.name;
            App.confirmDelete(name).then((r) => {if(r.isConfirmed){Store.remove('books',id);App.showAlert('success','Volume deleted.');load();}});
        });});
        document.querySelectorAll('.btn-barcode').forEach((btn) => {
            btn.addEventListener('click', () => {
                const title = btn.dataset.title, isbn = btn.dataset.isbn;
                document.getElementById('barcode-book-title').textContent = title;
                document.getElementById('barcode-book-isbn').textContent = isbn;
                try { JsBarcode('#barcode-svg', isbn.replace(/-/g, ''), { format:'CODE128',width:2,height:80,displayValue:true,fontSize:14,margin:10,background:'#1e1e32',lineColor:'#e2e0fc' }); }
                catch(e) { JsBarcode('#barcode-svg', isbn, { format:'CODE128',width:2,height:80,displayValue:true,background:'#1e1e32',lineColor:'#e2e0fc' }); }
                App.openModal('modal-barcode');
            });
        });
    };

    document.getElementById('btn-add').addEventListener('click', () => {
        document.getElementById('modal-title').textContent='Add Volume'; document.getElementById('edit-id').value='';
        ['f-title','f-isbn','f-year','f-copies','f-available','f-callnumber'].forEach((id) => {document.getElementById(id).value='';});
        App.openModal('modal-form');
    });

    document.getElementById('btn-save').addEventListener('click', () => {
        const title=document.getElementById('f-title').value.trim(), isbn=document.getElementById('f-isbn').value.trim(),
            authorId=document.getElementById('f-author').value, pubId=document.getElementById('f-publisher').value,
            catId=document.getElementById('f-category').value, year=parseInt(document.getElementById('f-year').value)||0,
            copies=parseInt(document.getElementById('f-copies').value)||0, avail=parseInt(document.getElementById('f-available').value)||0,
            callNum=document.getElementById('f-callnumber').value.trim();
        if(!title||!isbn){App.showAlert('danger','Title and ISBN required.');return;}
        const data={title,isbn,author_id:authorId,publisher_id:pubId,category_id:catId,call_number:callNum,year,copies,available:avail,status:'active'};
        const eid=document.getElementById('edit-id').value;
        const promise = eid ? Store.update('books',eid,data) : Store.create('books',data);
        promise.then(() => { App.showAlert('success', eid ? 'Volume updated.' : 'Volume added.'); App.closeModal('modal-form'); load(); })
        .catch((err) => { Swal.fire({icon:'error',title:'Not Allowed',text:err.message||'Could not save.',confirmButtonColor:'#e17141',background:'#1e1e32',color:'#e2e0fc'}); });
    });

    document.getElementById('search-input').addEventListener('input',load);
    document.getElementById('filter-cat').addEventListener('change',load);
    document.getElementById('filter-author').addEventListener('change',load);
    document.getElementById('filter-pub').addEventListener('change',load);
    document.getElementById('filter-avail').addEventListener('change',load);
    document.getElementById('filter-sort').addEventListener('change',load);

    document.getElementById('btn-print-barcode').addEventListener('click', () => {
        const svg = document.getElementById('barcode-svg'), title = document.getElementById('barcode-book-title').textContent, isbn = document.getElementById('barcode-book-isbn').textContent;
        const svgData = new XMLSerializer().serializeToString(svg);
        const w = window.open('','_blank','width=500,height=400');
        w.document.write(`<html><head><title>Barcode - ${title}</title><style>body{font-family:Inter,sans-serif;text-align:center;padding:40px}h3{margin:0 0 4px;font-size:16px}p{margin:0 0 16px;color:#666;font-size:12px}.label{border:2px dashed #ccc;padding:20px;display:inline-block;border-radius:8px}@media print{.no-print{display:none}.label{border:none}}</style></head><body>`);
        w.document.write(`<div class="label"><h3>${title}</h3><p>${isbn}</p>${svgData}</div>`);
        w.document.write('<br><button class="no-print" onclick="window.print()" style="margin-top:20px;padding:10px 24px;font-size:14px;cursor:pointer;border:none;background:#e17141;color:#fff;border-radius:6px">Print</button></body></html>');
        w.document.close();
    });

    document.getElementById('btn-lcc-lookup').addEventListener('click', () => {
        const title = document.getElementById('f-title').value.trim();
        document.getElementById('lcc-search-input').value = title;
        document.getElementById('lcc-results').innerHTML = '';
        document.getElementById('lcc-empty').style.display = 'none';
        App.openModal('modal-lcc');
        if (title) lccSearch(title);
    });
    document.getElementById('btn-lcc-search').addEventListener('click', () => { lccSearch(document.getElementById('lcc-search-input').value.trim()); });
    document.getElementById('lcc-search-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') lccSearch(e.target.value.trim()); });

    const lccSearch = (query) => {
        if (!query) return;
        const loading = document.getElementById('lcc-loading'), results = document.getElementById('lcc-results'), empty = document.getElementById('lcc-empty');
        loading.style.display = ''; results.innerHTML = ''; empty.style.display = 'none';
        axios.get('https://www.loc.gov/books/', { params: { q: query, fo: 'json', c: 10, sp: 1 } })
        .then((resp) => {
            loading.style.display = 'none';
            const items = resp.data.results || [];
            const withCall = items.filter((r) => r.item && r.item.call_number && r.item.call_number.length > 0);
            if (!withCall.length) { empty.style.display = ''; return; }
            results.innerHTML = withCall.map((r) => {
                const t = (r.item && r.item.title) || r.title || 'Untitled';
                const cn = r.item.call_number[0];
                return `<div class="lcc-row flex items-center justify-between px-3 py-2.5 border-b border-[#3a3a52] last:border-0 cursor-pointer hover:bg-[#ffb599]/5 transition-colors" data-call="${cn.replace(/"/g,'&quot;')}"><span class="text-[13px] font-semibold text-[#e2e0fc] max-w-[280px] truncate">${t}</span><span class="bg-[#ffb599]/10 text-[#ffb599] px-2.5 py-0.5 rounded-md text-[11px] font-bold font-mono whitespace-nowrap">${cn}</span></div>`;
            }).join('');
            results.querySelectorAll('.lcc-row').forEach((row) => {
                row.addEventListener('click', () => {
                    document.getElementById('f-callnumber').value = row.dataset.call;
                    App.closeModal('modal-lcc');
                    Swal.fire({ icon:'success',title:'Call Number Applied',text:row.dataset.call,timer:1500,showConfirmButton:false,toast:true,position:'top-end',background:'#1e1e32',color:'#e2e0fc' });
                });
            });
        }).catch(() => { loading.style.display='none'; empty.style.display=''; empty.textContent='Error connecting to LOC API.'; });
    };

    load();
  </script>
</body>
</html>
