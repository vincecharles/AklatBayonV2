<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Audit Logs - AklatBayon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="/css/custom.css" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('aklatbayon_theme');if(t==='dark')document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark');})()</script>

  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] } } } }
  </script>
</head>
<body class="font-sans min-h-screen antialiased ab-body-themed">
  <div class="astral-layout">
    <header id="top-header"></header>
    <nav id="sidebar-nav"></nav>
    <main class="astral-main pb-12">
      <div id="alert-container"></div>

      <!-- Header Section -->
      <div class="flex justify-between items-end mb-8 border-b border-slate-800 pb-6">
        <div>
          <h1 class="text-3xl font-mono font-bold text-slate-100 flex items-center gap-3 uppercase tracking-tighter">
            <span class="text-orange-500">_</span>System Audit Logs
          </h1>
          <p class="text-slate-500 font-mono text-xs mt-1">REAL-TIME_EVENT_STREAM // ACCESS_LEVEL:0</p>
        </div>
        <div class="flex gap-4">
          <div class="flex flex-col items-end">
            <span class="text-[10px] text-slate-500 font-mono">DB_SYNC_STATUS</span>
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono text-green-500">SYNCED</span>
              <div class="w-24 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div class="w-[98%] h-full bg-green-500"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-12 gap-6">
        <!-- Left: Filters and Table -->
        <div class="col-span-12 lg:col-span-9 space-y-6">
          <!-- Control Bar -->
          <div class="bg-slate-900/50 p-4 border border-slate-800 rounded-lg flex flex-wrap items-center gap-4">
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-mono text-slate-500 uppercase">Filters:</span>
              <button class="filter-btn px-3 py-1 bg-slate-800 border border-slate-700 text-[10px] font-mono text-slate-300 hover:border-blue-500 transition-colors uppercase" data-filter="">ALL</button>
              <button class="filter-btn px-3 py-1 bg-slate-800 border border-green-900/50 text-[10px] font-mono text-green-400 hover:bg-green-950 transition-colors uppercase" data-filter="CREATE">CREATE</button>
              <button class="filter-btn px-3 py-1 bg-slate-800 border border-blue-900/50 text-[10px] font-mono text-blue-400 hover:bg-blue-950 transition-colors uppercase" data-filter="UPDATE">UPDATE</button>
              <button class="filter-btn px-3 py-1 bg-red-950/30 border border-red-900 text-[10px] font-mono text-red-500 hover:bg-red-900/40 transition-colors uppercase" data-filter="DELETE">DELETE</button>
              <button class="filter-btn px-3 py-1 bg-slate-800 border border-slate-700 text-[10px] font-mono text-slate-300 hover:border-orange-500 transition-colors uppercase" data-filter="LOGIN">LOGIN</button>
            </div>
            <div class="relative flex-1 max-w-xs ml-auto">
              <input type="text" id="search-input" placeholder="SEARCH_LOGS..." class="bg-slate-900 border border-orange-900/50 text-orange-400 font-mono text-xs px-4 py-1.5 w-full focus:outline-none focus:border-orange-500 transition-colors rounded">
            </div>
            <div class="ml-auto flex items-center gap-3">
              <span class="text-[10px] font-mono text-slate-500" id="log-count">SHOWING 0 ENTRIES</span>
            </div>
          </div>

          <!-- Audit Log Table -->
          <div class="overflow-hidden border border-slate-800 bg-slate-900/30 rounded-lg">
            <table class="w-full text-left font-mono text-sm border-collapse">
              <thead>
                <tr class="bg-slate-900/80 text-orange-500/70 border-b border-slate-800 uppercase text-[11px] tracking-widest">
                  <th class="p-4 font-bold">Timestamp</th>
                  <th class="p-4 font-bold">User</th>
                  <th class="p-4 font-bold">Action</th>
                  <th class="p-4 font-bold">Entity</th>
                  <th class="p-4 font-bold text-center">Status</th>
                  <th class="p-4 font-bold">Details</th>
                </tr>
              </thead>
              <tbody id="data-table" class="divide-y divide-slate-800/50"></tbody>
            </table>
          </div>
        </div>

        <!-- Right: System Health Sidebar -->
        <div class="col-span-12 lg:col-span-3 space-y-6">
          <div class="bg-slate-900/50 border border-slate-800 p-6 rounded-lg backdrop-blur-sm">
            <h2 class="text-slate-100 font-mono font-bold text-xs uppercase mb-6 flex items-center gap-2">
              <span class="material-symbols-outlined text-orange-500 text-sm">analytics</span>
              System Health
            </h2>
            <div class="space-y-6">
              <div class="space-y-2">
                <div class="flex justify-between text-[10px] font-mono uppercase">
                  <span class="text-slate-500">LOG ENTRIES</span>
                  <span class="text-orange-400" id="health-logs">0</span>
                </div>
                <div class="h-1 w-full bg-slate-800 rounded-full"><div id="health-bar-logs" class="h-full bg-orange-500 rounded-full" style="width:0%"></div></div>
              </div>
              <div class="space-y-2">
                <div class="flex justify-between text-[10px] font-mono uppercase">
                  <span class="text-slate-500">BOOKS TRACKED</span>
                  <span class="text-orange-400" id="health-books">0</span>
                </div>
                <div class="h-1 w-full bg-slate-800 rounded-full"><div id="health-bar-books" class="h-full bg-orange-500 rounded-full" style="width:60%"></div></div>
              </div>
              <div class="space-y-2">
                <div class="flex justify-between text-[10px] font-mono uppercase">
                  <span class="text-slate-500">ACTIVE USERS</span>
                  <span class="text-green-500" id="health-users">0</span>
                </div>
                <div class="h-1 w-full bg-slate-800 rounded-full"><div id="health-bar-users" class="h-full bg-green-500 rounded-full" style="width:40%"></div></div>
              </div>
              <hr class="border-slate-800">
              <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-800/40 p-2 rounded border border-slate-800/50">
                  <p class="text-[9px] text-slate-500 font-mono uppercase">Node ID</p>
                  <p class="text-[10px] text-slate-300 font-mono">FEATI-LMS-01</p>
                </div>
                <div class="bg-slate-800/40 p-2 rounded border border-slate-800/50">
                  <p class="text-[9px] text-slate-500 font-mono uppercase">Version</p>
                  <p class="text-[10px] text-slate-300 font-mono">v0.8.2</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) { window.location.href = '/pages/auth/login.html'; throw ''; }

    let activeFilter = '';

    const colorMap = {
      CREATE: { bg: 'bg-green-950/30', text: 'text-green-500', border: 'border-green-900', label: 'SUCCESS', rowBg: '' },
      UPDATE: { bg: 'bg-blue-950/30', text: 'text-blue-400', border: 'border-blue-900', label: 'UPDATED', rowBg: '' },
      DELETE: { bg: 'bg-red-950', text: 'text-red-500', border: 'border-red-500', label: 'DELETED', rowBg: 'bg-red-950/10' },
      LOGIN: { bg: 'bg-blue-950/30', text: 'text-blue-400', border: 'border-blue-900', label: 'LOGIN', rowBg: '' },
      LOGOUT: { bg: 'bg-slate-800', text: 'text-slate-400', border: 'border-slate-700', label: 'LOGOUT', rowBg: '' },
      SEED: { bg: 'bg-slate-800', text: 'text-slate-400', border: 'border-slate-700', label: 'SEED', rowBg: '' },
      RFID_LOGIN: { bg: 'bg-purple-950/30', text: 'text-purple-400', border: 'border-purple-500', label: 'RFID', rowBg: 'bg-purple-950/5' }
    };
    const defaultStyle = { bg: 'bg-slate-800', text: 'text-slate-400', border: 'border-slate-700', label: '—', rowBg: '' };

    const load = () => {
      let logs = Store.getAll('audit_logs');
      const s = document.getElementById('search-input').value.toLowerCase();

      if (s) logs = logs.filter(l => l.user.toLowerCase().includes(s) || l.details.toLowerCase().includes(s) || l.entity.toLowerCase().includes(s));
      if (activeFilter) logs = logs.filter(l => l.action === activeFilter);

      // Sort newest first
      logs.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

      document.getElementById('log-count').textContent = `SHOWING ${logs.length} ENTRIES`;

      const tbody = document.getElementById('data-table');
      if (!logs.length) { tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-500 font-mono">NO_ENTRIES_FOUND</td></tr>'; return; }

      tbody.innerHTML = logs.map(l => {
        const style = colorMap[l.action] || defaultStyle;
        const ts = l.created_at ? new Date(l.created_at).toLocaleString('en-US', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}) : '—';
        return `<tr class="hover:bg-orange-500/5 transition-colors ${style.rowBg}">
          <td class="p-4 text-slate-500 text-xs">${ts}</td>
          <td class="p-4 text-orange-400 font-bold">${l.user}</td>
          <td class="p-4 text-slate-200">${l.action}</td>
          <td class="p-4 text-slate-400">${l.entity}</td>
          <td class="p-4 text-center"><span class="text-[10px] ${style.bg} ${style.text} border ${style.border} px-2 py-0.5 rounded">${style.label}</span></td>
          <td class="p-4 text-slate-500 text-xs max-w-xs truncate">${l.details}</td>
        </tr>`;
      }).join('');
    };

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('ring-1','ring-orange-500'));
        btn.classList.add('ring-1','ring-orange-500');
        load();
      });
    });

    document.getElementById('search-input').addEventListener('input', load);

    App.init().then(() => {
      const allLogs = Store.getAll('audit_logs');
      const allBooks = Store.getAll('books');
      const allUsers = Store.getAll('users');
      document.getElementById('health-logs').textContent = allLogs.length;
      document.getElementById('health-books').textContent = allBooks.length;
      document.getElementById('health-users').textContent = allUsers.length;
      document.getElementById('health-bar-logs').style.width = Math.min(100, allLogs.length / 5) + '%';
      document.getElementById('health-bar-books').style.width = Math.min(100, allBooks.length * 10) + '%';
      document.getElementById('health-bar-users').style.width = Math.min(100, allUsers.length * 15) + '%';
      load();
    });
    document.addEventListener('aklatbayon:refreshed', load);
  </script>
</body>
</html>
