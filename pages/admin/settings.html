<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - AklatBayon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="/css/custom.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] },  } }
    }
  </script>
</head>
<body class="bg-bg-light dark:bg-bg-dark font-sans text-slate-800 dark:text-slate-100 min-h-screen">
<div class="astral-layout">
  <header id="top-header"></header>
  <nav id="sidebar-nav"></nav>
  <main class="astral-main pb-12">
    <div id="alert-container"></div>

    <!-- Page Header -->
    <div class="flex items-center gap-3 mb-6">
      <span class="material-symbols-outlined text-3xl text-[#ffb599] dark:text-primary-50">tune</span>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Settings</h1>
    </div>

    <!-- Settings Card -->
    <div class="astral-card">
      <!-- Card Header -->
      <div class="flex items-center gap-2.5 px-6 py-4 border-b border-[#3a3a52]">
        <span class="material-symbols-outlined text-xl text-[#ffb599] dark:text-primary-50">settings</span>
        <h2 class="text-base font-semibold text-slate-900 dark:text-white">System Configuration</h2>
      </div>

      <!-- Card Body -->
      <div class="p-6">
        <div id="settings-form"></div>

        <!-- Card Footer -->
        <div class="flex justify-end gap-3 pt-4 mt-4 border-t border-[#3a3a52]">
          <button id="btn-reset" class="inline-flex items-center gap-1.5 px-5 py-2.5 text-sm font-medium rounded-lg border border-red-300 dark:border-red-800 text-red-600 dark:text-red-400 hover:bg-[#f87171]/10 transition-colors">
            <span class="material-symbols-outlined text-lg">refresh</span>
            Reset Data
          </button>
          <button id="btn-save" class="inline-flex items-center gap-1.5 px-5 py-2.5 text-sm font-medium rounded-lg bg-[#ffb599] text-[#370e00] hover:shadow-[0_4px_20px_rgba(255,181,153,0.3)] transition-colors">
            <span class="material-symbols-outlined text-lg">save</span>
            Save Settings
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

  <script src="/js/api.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) { window.location.href = '/pages/auth/login.html'; throw ''; }
    App.init();
    const load = () => {
      const settings = Store.getAll('settings');
      let html = '';
      settings.forEach((s) => {
        html += `<div class="mb-4"><label class="block text-sm font-semibold text-[#e2e0fc] mb-1.5">${s.label}</label><input type="text" class="w-full h-11 px-3.5 text-sm rounded-lg border border-[#3a3a52] bg-[#1e1e32] text-[#e2e0fc] focus:outline-none focus:border-[#ffb599] focus:ring-1 focus:ring-[#ffb599]/30 setting-input" data-key="${s.key}" data-id="${s.id}" value="${s.value}"></div>`;
      });
      document.getElementById('settings-form').innerHTML = html;
    };
    document.getElementById('btn-save').addEventListener('click', () => {
      document.querySelectorAll('.setting-input').forEach((input) => {
        Store.update('settings', input.dataset.id, { value: input.value });
      });
      App.showAlert('success', 'Settings saved.');
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      Swal.fire({
        title: 'Reset All Data?',
        text: 'This will reset all data to the initial seed state. This cannot be undone.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#e17141', background: '#1e1e32', color: '#e2e0fc',
        confirmButtonText: 'Yes, reset!'
      }).then((r) => {
        if (r.isConfirmed) {
          localStorage.removeItem('aklatbayon_seeded');
          const themeKeys = ['aklatbayon_theme', 'aklatbayon_dark_mode'];
          const keys = Object.keys(localStorage);
          keys.forEach((k) => { if (k.startsWith('aklatbayon_') && !themeKeys.includes(k)) localStorage.removeItem(k); });
          Store.seed();
          App.showAlert('success', 'Data reset to defaults.');
          load();
        }
      });
    });
    load();
  </script>
</body>
</html>
