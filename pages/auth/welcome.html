<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - AklatBayon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="/css/custom.css" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <style>
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(124,58,237,0.1); }
      50%      { box-shadow: 0 0 40px 15px rgba(124,58,237,0.08); }
    }
    .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
  </style>
</head>
<body class="font-sans min-h-screen antialiased">
  <div class="fixed inset-0 bg-gradient-to-br from-[#1e1b4b] via-[#312e81] to-[#4c1d95] flex items-center justify-center overflow-hidden">
    <div id="particles" class="fixed inset-0 pointer-events-none z-0"></div>
    <div class="relative z-10 text-center animate-fade-in">
      <div class="w-[100px] h-[100px] rounded-2xl bg-white/10 border-2 border-white/15 flex items-center justify-center mx-auto mb-6 overflow-hidden animate-pulse-glow">
        <img src="/images/logo.png" alt="AklatBayon" class="w-[70px] h-[70px] object-contain">
      </div>
      <p class="text-sm font-semibold uppercase tracking-[3px] text-white/40 mb-2">Welcome Back</p>
      <h1 class="text-[38px] font-black tracking-wide text-white mb-3" id="user-name">User</h1>
      <div class="inline-block px-5 py-1.5 rounded-full text-[13px] font-semibold tracking-wide mb-8" id="user-role">Role</div>
      <p class="text-[13px] text-white/30">
        Redirecting to dashboard<span class="inline-block w-5 text-left" id="dots"></span>
      </p>
      <div class="w-[200px] h-[3px] bg-white/10 rounded-full mx-auto mt-4 overflow-hidden">
        <div class="h-full bg-gradient-to-r from-purple-400 to-violet-500 rounded-full animate-fill-bar"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/auth.js"></script>
  <script>
      const user = Auth.getCurrentUser();
      if (!user) { window.location.href = '/pages/auth/login.html'; }
      else {
          document.getElementById('user-name').textContent = user.name;
          let roleText = user.role_name;
          if (user.faculty_subtype) roleText += ` — ${user.faculty_subtype}`;
          const roleEl = document.getElementById('user-role');
          roleEl.textContent = roleText;
          const roleClassMap = {
              'System Administrator': 'role-admin',
              'Head Librarian': 'role-librarian',
              'Librarian Staff': 'role-librarian',
              'Faculty': 'role-faculty',
              'Student': 'role-student',
              'Student Assistant': 'role-assistant',
              'Guest': 'role-guest'
          };
          roleEl.classList.add(roleClassMap[user.role_name] || 'role-guest');
      }
      let dotCount = 0;
      setInterval(() => {
          dotCount = (dotCount + 1) % 4;
          document.getElementById('dots').textContent = '.'.repeat(dotCount);
      }, 500);
      (() => {
          const container = document.getElementById('particles');
          for (let i = 0; i < 20; i++) {
              const p = document.createElement('div');
              p.className = 'particle';
              p.style.left = `${Math.random() * 100}%`;
              p.style.animationDuration = `${8 + Math.random() * 12}s`;
              p.style.animationDelay = `${Math.random() * 10}s`;
              p.style.width = p.style.height = `${1 + Math.random() * 3}px`;
              container.appendChild(p);
          }
      })();
      setTimeout(() => { window.location.href = '/pages/general/dashboard.html'; }, 3000);
  </script>
</body>
</html>
