<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fine Management - AklatBayon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="/css/custom.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          /* colors removed - using astral CSS */,
            accent: '#e94560',
            'bg-light': '#f6f6f8',
            'bg-dark': '#131022',
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans min-h-screen antialiased" style="background:#111125;color:#e2e0fc">
  <div class="astral-layout">
    <header id="top-header"></header>
    <nav id="sidebar-nav"></nav>
    <main class="astral-main pb-12">
      <div id="alert-container"></div>

      <!-- Page Header -->
      <div class="flex items-center justify-between mb-6 pb-4 border-b border-[#3a3a52]">
        <h1 class="text-2xl font-black tracking-tight flex items-center gap-2">
          <span class="material-symbols-outlined text-[#ffb599] dark:text-primary-50">receipt_long</span>
          Fine Management
        </h1>
      </div>

      <!-- Filter Bar -->
      <div class="flex flex-wrap items-center gap-3 bg-white dark:bg-slate-900 p-4 rounded-xl border border-[#3a3a52] mb-5">
        <div class="relative flex-1 min-w-[200px]">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">search</span>
          <input type="text" id="search-input" placeholder="Search fines..."
            class="h-10 w-full pl-10 pr-4 text-sm rounded-lg border border-[#3a3a52] bg-[#1e1e32] focus:border-[#ffb599] focus:ring-1 focus:ring-primary outline-none">
        </div>
        <select id="filter-status"
          class="h-10 px-3 text-sm rounded-lg border border-[#3a3a52] bg-[#1e1e32] focus:border-[#ffb599] focus:ring-1 focus:ring-primary outline-none max-w-[160px]">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="waived">Waived</option>
        </select>
      </div>

      <!-- Table Card -->
      <div class="astral-card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="bg-[#1a1a2e]">
              <tr>
                <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-[#9b99b8]">#</th>
                <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-[#9b99b8]">Student</th>
                <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-[#9b99b8]">Reason</th>
                <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-[#9b99b8]">Amount</th>
                <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-[#9b99b8]">Status</th>
                <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-[#9b99b8]">Date</th>
                <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-[#9b99b8]">Actions</th>
              </tr>
            </thead>
            <tbody id="data-table" class="divide-y divide-[#3a3a52]/50"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) { window.location.href = '/pages/auth/login.html'; throw ''; }
    App.init();

    const load = () => {
        let items = Store.getAll('fines');
        const s = document.getElementById('search-input').value.toLowerCase();
        const sf = document.getElementById('filter-status').value;
        if (sf) items = items.filter((f) => f.status === sf);
        if (s) items = items.filter((f) => App.getStudentName(f.student_id).toLowerCase().includes(s) || f.reason.toLowerCase().includes(s));
        const tbody = document.getElementById('data-table');
        if (!items.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-sm text-[#9b99b8]">No fines found.</td></tr>';
            return;
        }
        const statusMap = {
            pending: '" style="background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.3)',
            paid: 'astral-badge-active" style="background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.3)',
            waived: 'bg-slate-100 text-slate-600 dark:bg-slate-700/40 dark:text-slate-300'
        };
        tbody.innerHTML = items.map((f, i) => {
            const actions = f.status === 'pending'
                ? `<button class="btn-collect inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors bg-gradient-to-r from-[#ffb599] to-[#e17141] text-[#370e00] hover:shadow-[0_4px_20px_rgba(255,181,153,0.3)]" data-id="${f.id}"><span class="material-symbols-outlined text-[16px]">check_circle</span>Collect</button> <button class="btn-waive inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors bg-sky-600 hover:bg-sky-700 text-white" data-id="${f.id}"><span class="material-symbols-outlined text-[16px]">volunteer_activism</span>Waive</button>`
                : '<span class="text-xs text-[#9b99b8]">Resolved</span>';
            return `<tr class="hover:bg-[#ffb599]/5 transition-colors"><td class="px-4 py-3 text-sm text-[#9b99b8]">${i+1}</td><td class="px-4 py-3 text-sm font-medium">${App.getStudentName(f.student_id)}</td><td class="px-4 py-3 text-sm">${f.reason}</td><td class="px-4 py-3 text-sm font-semibold">\u20B1${f.amount}</td><td class="px-4 py-3"><span class="inline-block px-2.5 py-1 rounded-full text-[11px] font-semibold ${statusMap[f.status] || 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300'}">${f.status}</span></td><td class="px-4 py-3 text-sm text-[#9b99b8]">${App.formatDate(f.created_at)}</td><td class="px-4 py-3">${actions}</td></tr>`;
        }).join('');
        document.querySelectorAll('.btn-collect').forEach((b) => {
            b.addEventListener('click', () => { Store.update('fines', b.dataset.id, { status: 'paid' }); App.showAlert('success', 'Fine collected.'); load(); });
        });
        document.querySelectorAll('.btn-waive').forEach((b) => {
            b.addEventListener('click', () => { Store.update('fines', b.dataset.id, { status: 'waived' }); App.showAlert('success', 'Fine waived.'); load(); });
        });
    };

    document.getElementById('search-input').addEventListener('input', load);
    document.getElementById('filter-status').addEventListener('change', load);
    load();
  </script>
</body>
</html>
