<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AklatBayon - System Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom hide logic for Faculty Subtype without using heavy JS */
        #role-select:not(:focus-within) + #faculty-subtype-container {
            display: none;
        }
        /* Using a peer-checked style approach for a pure CSS progressive disclosure simulation */
        #role-select:has(option[value="Faculty"]:checked) ~ #faculty-subtype-container {
            display: block;
        }
        .glass-panel {
            background: rgba(26, 26, 46, 0.7);
            backdrop-filter: blur(20px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "inverse-primary": "#a04113",
                        "on-secondary": "#4d2600",
                        "on-primary-container": "#4e1800",
                        "surface-container-low": "#1a1a2e",
                        "surface-bright": "#37374d",
                        "secondary-fixed": "#ffdcc3",
                        "surface-variant": "#333348",
                        "on-tertiary": "#38265a",
                        "on-surface-variant": "#ddc0b6",
                        "primary": "#ffb599",
                        "on-primary": "#5a1c00",
                        "on-surface": "#e2e0fc",
                        "inverse-surface": "#e2e0fc",
                        "on-tertiary-fixed": "#231043",
                        "surface-dim": "#111125",
                        "on-primary-fixed": "#370e00",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "on-tertiary-container": "#311f52",
                        "tertiary-fixed": "#ebddff",
                        "surface-tint": "#ffb599",
                        "secondary": "#ffb77d",
                        "primary-container": "#e17141",
                        "surface-container": "#1e1e32",
                        "secondary-fixed-dim": "#ffb77d",
                        "secondary-container": "#783f00",
                        "primary-fixed": "#ffdbce",
                        "surface-container-lowest": "#0c0c1f",
                        "on-secondary-container": "#ffad68",
                        "on-error": "#690005",
                        "on-tertiary-fixed-variant": "#4f3d72",
                        "on-secondary-fixed-variant": "#6e3900",
                        "inverse-on-surface": "#2f2e43",
                        "outline-variant": "#56423b",
                        "on-background": "#e2e0fc",
                        "tertiary": "#d2bcfa",
                        "on-error-container": "#ffdad6",
                        "primary-fixed-dim": "#ffb599",
                        "on-primary-fixed-variant": "#7f2b00",
                        "background": "#111125",
                        "on-secondary-fixed": "#2f1500",
                        "tertiary-fixed-dim": "#d2bcfa",
                        "tertiary-container": "#9b87c1",
                        "surface-container-high": "#28283d",
                        "outline": "#a58b82",
                        "surface-container-highest": "#333348",
                        "surface": "#111125"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-surface-container-lowest min-h-screen flex items-center justify-center font-body text-on-surface p-4 relative overflow-hidden">
<!-- Background Astral Glows -->
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary/10 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Main Registration Modal -->
<div class="glass-panel w-full max-w-lg rounded-3xl p-8 md:p-12 shadow-[0_32px_48px_-12px_rgba(12,12,31,0.5)] border border-outline-variant/10 relative z-10">
<!-- Header Section -->
<header class="text-center mb-10">
<h1 class="text-3xl font-headline font-bold tracking-tight text-primary mb-2">System Registration</h1>
<p class="text-on-surface-variant text-sm tracking-wide">Enter your credentials to gain access</p>
</header>
<!-- Form Container -->
<form class="space-y-6">
<!-- Full Name -->
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="w-full bg-surface-variant/40 border-none rounded-xl py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/50 transition-all" id="fullname" placeholder="Full Name" type="text"/>
</div>
<!-- Email Address -->
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full bg-surface-variant/40 border-none rounded-xl py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/50 transition-all" id="email" placeholder="Email Address" type="email"/>
</div>
<!-- Grid for Username and Password -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">account_circle</span>
</div>
<input class="w-full bg-surface-variant/40 border-none rounded-xl py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/50 transition-all" id="username" placeholder="Username" type="text"/>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full bg-surface-variant/40 border-none rounded-xl py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/50 transition-all" id="password" placeholder="Password" type="password"/>
</div>
</div>
<!-- Role Selection -->
<div class="space-y-4">
<div class="relative group">
<select class="w-full appearance-none bg-surface-variant/40 border-none rounded-xl py-4 px-4 text-on-surface focus:ring-2 focus:ring-primary/50 transition-all cursor-pointer" id="role-select">
<option disabled="" selected="" value="">Select Role</option>
<option value="Student">Student</option>
<option value="Faculty">Faculty</option>
<option value="Student Assistant">Student Assistant</option>
<option value="Guest">Guest</option>
</select>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
<!-- Progressive Disclosure: Faculty Subtype -->
<div class="hidden animate-in fade-in slide-in-from-top-2 duration-300" id="faculty-subtype-container">
<div class="relative group">
<select class="w-full appearance-none bg-surface-container-high/60 border-none rounded-xl py-4 px-4 text-on-surface focus:ring-2 focus:ring-tertiary/50 transition-all cursor-pointer" id="faculty-subtype">
<option disabled="" selected="" value="">Faculty Subtype</option>
<option value="Teaching">Teaching</option>
<option value="Non-Teaching">Non-Teaching</option>
<option value="Department Chair">Department Chair</option>
<option value="Department Head">Department Head</option>
</select>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-tertiary">schema</span>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4 pt-4">
<button class="w-full py-4 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold tracking-widest text-sm shadow-[0_10px_30px_-10px_rgba(255,181,153,0.4)] active:scale-95 transition-all flex items-center justify-center gap-2" type="submit">
                    REGISTER &amp; ENTER
                    <span class="material-symbols-outlined text-[20px]">login</span>
</button>
<button class="w-full py-3 rounded-full bg-transparent border border-outline-variant/30 text-on-surface-variant font-medium text-sm hover:bg-surface-variant/20 active:scale-95 transition-all" type="button">
                    CANCEL
                </button>
</div>
</form>
<!-- Footer Meta -->
<footer class="mt-8 text-center">
<p class="text-[11px] text-outline uppercase tracking-[0.2em]">AklatBayon Terminal v2.04</p>
</footer>
</div>
<!-- Script for progressive disclosure toggle -->
<script>
        const roleSelect = document.getElementById('role-select');
        const facultyContainer = document.getElementById('faculty-subtype-container');

        roleSelect.addEventListener('change', (e) => {
            if (e.target.value === 'Faculty') {
                facultyContainer.classList.remove('hidden');
            } else {
                facultyContainer.classList.add('hidden');
            }
        });
    </script>
</body></html>
